[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a real PostgreSQL with pgvector (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S", "DTZ", "C901"]
ignore = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["app", "tests", "migrations"]
disallow_any_explicit = true
plugins = ["pydantic.mypy"]
