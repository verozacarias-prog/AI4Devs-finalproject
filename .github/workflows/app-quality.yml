# Application quality: the pipeline checks that need the code (ADR 0021). The other two
# checks, the repository verifiers and the secret scan, run in docs-quality.yml.
#
# Each action is pinned to its commit hash, with the version in a comment. No check needs a
# stored secret.
name: Aplicación — calidad

on:
  push:
    branches: [main, 'feature/entrega-*', 'final-project-*']
  pull_request:

permissions:
  contents: read

jobs:
  backend-estatico:
    name: Backend — formato, lint y tipos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes or needs the token after the checkout.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  backend-tests:
    name: Backend — tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      # A real PostgreSQL with pgvector, empty on every run: the migrations test applies
      # them from scratch. The credentials only exist inside this job.
      db:
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: platita
          POSTGRES_PASSWORD: platita
          POSTGRES_DB: platita
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platita -d platita"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://platita:platita@127.0.0.1:5432/platita
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes or needs the token after the checkout.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pytest

  backend-dependencias:
    name: Backend — vulnerabilidades en dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes or needs the token after the checkout.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      # The version is the one pinned in requirements-dev.txt, with its hash.
      - run: pip install --require-hashes -r requirements-dev.txt
      # Blocks on any vulnerability that has a fix: the tool does not filter by severity.
      - run: pip-audit -r requirements.txt

  dashboard:
    name: Dashboard — lint, tipos, tests y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes or needs the token after the checkout.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The four states of every screen, against a simulated API.
      - run: npm test
      - run: npm run build

  punta-a-punta:
    name: De punta a punta — un gasto en el chat baja el saldo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes or needs the token after the checkout.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds the image and starts the whole stack with Docker Compose, with a fake of the
      # model provider: no key and no call leaves the runner (#79).
      - run: npm run test:e2e
        env:
          # The runner is thrown away anyway: the stack stays up for the logs of a failure.
          E2E_KEEP_STACK: 'true'
      # Only on a failure: what each container wrote, and the trace of the browser.
      - if: failure()
        run: >-
          docker compose --project-name platita-e2e --env-file frontend/e2e/compose.env
          --file docker-compose.yml --file frontend/e2e/compose.e2e.yml logs --no-color
        working-directory: .
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  dashboard-dependencias:
    name: Dashboard — vulnerabilidades en dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes or needs the token after the checkout.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # Blocks from high severity up (ADR 0021).
      - run: npm audit --audit-level=high

  contrato:
    name: El cliente del dashboard coincide con el contrato de la API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes or needs the token after the checkout.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install --require-hashes -r requirements.txt
        working-directory: backend
      - name: Export the contract from the API
        run: python -m app.adapters.inbound.api.export_openapi > ../frontend/src/api/openapi.json
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Generate the dashboard types from the contract
        run: npm run api:generate
        working-directory: frontend
      - name: Neither file changed
        # Both are versioned. If the API changed and they were not regenerated, it shows here.
        run: git diff --exit-code -- frontend/src/api
