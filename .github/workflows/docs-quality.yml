# Calidad de la documentación. Lleva a CI lo que el hook de .githooks/pre-commit
# corre en local, para que no dependa de que cada clon configure core.hooksPath
# ni de que nadie use --no-verify.
#
# Cada acción va fijada al hash de su commit, con la versión en un comentario
# (ADR 0021). Dependabot propone las actualizaciones: .github/dependabot.yml.
name: Documentación — calidad

on:
  # El repositorio es un fork del repo del curso y la entrega va como pull
  # request al upstream. En un pull request contra otro repositorio, GitHub
  # ejecuta los workflows del repositorio base, no los de este, así que el
  # disparador que de verdad sirve acá es el push a la rama de trabajo.
  push:
    branches: [main, 'feature/**']
  pull_request:
  schedule:
    # Los enlaces externos se rompen sin que nadie toque la documentación.
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  verificadores:
    name: Verificadores del proyecto
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Convenciones de documentación
        run: python3 scripts/verify_docs.py
      - name: Regla de dependencia hexagonal
        run: python3 scripts/verify_architecture.py

  markdown:
    name: Formato Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: markdownlint
        # La configuración, incluidas las exclusiones, está en .markdownlint-cli2.yaml.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

  portal:
    name: El portal compila y llms.txt está al día
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: llms.txt se regenera sin diferencias
        # Está versionado porque un agente que clona el repositorio no ve el
        # sitio. Si docs/ cambió y no se regeneró, acá se nota.
        run: git diff --exit-code -- llms.txt

  enlaces:
    name: Enlaces externos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml --no-progress './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secretos:
    name: Secretos en el código
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks recorre los commits del push, no solo el último.
          fetch-depth: 0
      - name: gitleaks
        # Las excepciones, una por hallazgo, están en .gitleaksignore.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          # Token automático del job, de solo lectura. No es un secreto guardado.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'
