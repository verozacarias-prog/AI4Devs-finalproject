# Calidad de la documentación. Lleva a CI lo que el hook de .githooks/pre-commit
# corre en local, para que no dependa de que cada clon configure core.hooksPath
# ni de que nadie use --no-verify.
#
# Cada acción va fijada al hash de su commit, con la versión en un comentario
# (ADR 0021). Dependabot propone las actualizaciones: .github/dependabot.yml.
name: Documentación — calidad

on:
  # El trabajo entra a la rama de la entrega por pull requests dentro del
  # fork, desde ramas cortas (hu<N>-c<corte>-<tema> o tarea-<tema>): ahí
  # corre pull_request. El push cubre main y la rama de la entrega, que es
  # donde queda lo integrado. Ver docs/documentacion-viva.md, sección 7.
  push:
    branches: [main, 'feature/entrega-*']
  pull_request:
  schedule:
    # Los enlaces externos se rompen sin que nadie toque la documentación.
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  verificadores:
    name: Verificadores del proyecto
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Convenciones de documentación
        run: python3 scripts/verify_docs.py
      - name: Regla de dependencia hexagonal
        run: python3 scripts/verify_architecture.py

  markdown:
    name: Formato Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: markdownlint
        # La configuración, incluidas las exclusiones, está en .markdownlint-cli2.yaml.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

  portal:
    name: El portal compila y llms.txt está al día
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: llms.txt se regenera sin diferencias
        # Está versionado porque un agente que clona el repositorio no ve el
        # sitio. Si docs/ cambió y no se regeneró, acá se nota.
        run: git diff --exit-code -- llms.txt

  enlaces:
    name: Enlaces externos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml --no-progress './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secretos:
    name: Secretos en el código
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks recorre los commits del push, no solo el último.
          fetch-depth: 0
      - name: gitleaks
        # Las excepciones, una por hallazgo, están en .gitleaksignore.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Token automático del job, de solo lectura. No es un secreto guardado.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'
