# Construye el portal de documentación y lo publica en GitHub Pages.
# El contenido se genera desde docs/, que es la única fuente.
name: Documentación — despliegue

on:
  # Ver la nota de docs-quality.yml: el trabajo vive en una rama, no en main,
  # porque main es el espejo del repositorio del curso.
  #
  # El entorno github-pages solo acepta despliegues desde la rama por defecto
  # del repositorio. La rama de trabajo de la entrega en curso tiene que estar
  # configurada como rama por defecto de este fork, o el despliegue se rechaza
  # aunque el workflow corra entero.
  push:
    branches: [main, 'feature/**']
    paths:
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no se cancela el que esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
