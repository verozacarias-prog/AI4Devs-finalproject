# Local environment: the database, the migrations, the API, which also serves the dashboard
# under /app, and the worker that answers the messages, started with one command (ADR 0021).
#
#   cp .env.example .env
#   docker compose up --build
#
# Each container has a name of its own, which is what `docker compose logs` and `docker ps`
# show: without it they say "api-1", which tells nothing about what is running. The services
# keep their short names, so the commands and the address of the database do not change.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: platita-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Runs `alembic upgrade head` once and exits. Neither the API nor the worker migrates on
  # start-up: they wait for this service to finish successfully.
  migrations:
    build: .
    container_name: platita-migrations
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    container_name: platita-api-and-dashboard
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_ENV: ${APP_ENV:-local}
      APP_VERSION: ${APP_VERSION:-dev}
      # Off unless .env turns them on (ADR 0016).
      DEV_ENTRY_ENABLED: ${DEV_ENTRY_ENABLED:-false}
      WEB_CHAT_ENABLED: ${WEB_CHAT_ENABLED:-false}
      # Empty means the default of the code (docs/operacion.md).
      QUEUE_MAX_WAIT_MINUTES: ${QUEUE_MAX_WAIT_MINUTES:-}
      # Checked here too: with a lock not longer than the call, no process starts (ADR 0010).
      WORKER_LOCK_SECONDS: ${WORKER_LOCK_SECONDS:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully

  # Takes the stored messages and answers them (ADR 0010). Same image as the API, another
  # entry point. It listens on no port, so the health check of the image is off here.
  worker:
    build: .
    container_name: platita-worker
    command: ["python", "-m", "app.adapters.inbound.message_worker.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_ENV: ${APP_ENV:-local}
      APP_VERSION: ${APP_VERSION:-dev}
      # Read here too: with either one on in production, no process starts (ADR 0016).
      DEV_ENTRY_ENABLED: ${DEV_ENTRY_ENABLED:-false}
      WEB_CHAT_ENABLED: ${WEB_CHAT_ENABLED:-false}
      # Empty means the default of the code (docs/operacion.md).
      WORKER_LOCK_SECONDS: ${WORKER_LOCK_SECONDS:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-}
      MESSAGE_MAX_ATTEMPTS: ${MESSAGE_MAX_ATTEMPTS:-}
      MESSAGE_RETRY_FIRST_WAIT_SECONDS: ${MESSAGE_RETRY_FIRST_WAIT_SECONDS:-}
      MESSAGE_RETRY_MAX_WAIT_SECONDS: ${MESSAGE_RETRY_MAX_WAIT_SECONDS:-}
      LLM_DAILY_CLASSIFICATION_LIMIT: ${LLM_DAILY_CLASSIFICATION_LIMIT:-}
      LLM_DAILY_REGISTRATION_LIMIT: ${LLM_DAILY_REGISTRATION_LIMIT:-}
      # Only the worker calls the model. Without it, the worker does not start (ADR 0025).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    healthcheck:
      disable: true
    depends_on:
      migrations:
        condition: service_completed_successfully

volumes:
  db-data:
